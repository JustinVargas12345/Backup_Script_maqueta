version: "3.9"

services:
  # Base de datos de prueba: PostgreSQL
  postgres:
    image: postgres:16
    container_name: dbbackup_postgres
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: sampledb
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d sampledb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de datos de prueba: MySQL
  mysql:
    image: mysql:8.0
    container_name: dbbackup_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sampledb
      MYSQL_USER: test
      MYSQL_PASSWORD: test123
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - dbnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de datos de prueba: MongoDB
  mongo:
    image: mongo:7
    container_name: dbbackup_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sampledb
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test123
    volumes:
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
      - mongo_data:/data/db
    networks:
      - dbnet
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mysql_data:
  mongo_data:

networks:
  dbnet:
    driver: bridge
